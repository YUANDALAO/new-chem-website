url: "https://zhangchem.com" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
title: "Zhang Laboratory" # the name of your site, e.g. ACME Corp.
description: "Organic Synthesis for Drug Discovery"
avatar: "/images/zhangcheng_photo.jpg" 
email: "chengzhang@gzhmu.edu.cn"



# 启用HTML压缩
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

# 启用Sass压缩
sass:
  style: compressed

# 排除不必要的文件
exclude:
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.backup"

# 启用增量构建
incremental: true


# Tell Jekyll to process the _research folder as a collection
collections:
  research:
    output: true