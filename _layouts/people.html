---
layout: default
---

{{ content }}

<div class="people-container">
  <div class="people-row">
    {% for person in site.data.settings.people %}
    <div class="person-item" data-index="{{ forloop.index0 }}">
      <div class="text-center">
        <!-- 图片容器 - 保持所有图片区域大小一致 -->
        <div class="person-image-container">
          <!-- 确保图片按比例缩放并填充容器 -->
          <img src="{{ site.github.url }}/{{ person.image }}" alt="{{ person.name }}" 
               class="person-image">
        </div>
        <h5 class="person-name">{{ person.name }}</h5>
        <p class="person-title">{{ person.title}}</p>
        <!--<p class="person-office">Office: {{ person.office }}</p>-->
        <p class="person-more"><a href="{{ site.github.url }}/people/{{ person.url }}">More info</a></p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<style>
.people-row {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin: 0 -10px;
  padding: 0 10px;
}

.person-item {
  flex: 0 0 calc(25% - 20px);
  box-sizing: border-box;
  padding: 15px;
}

.person-image-container {
  width: 100%;
  max-width: 200px;
  height: 200px; /* 固定容器大小 */
  margin: 0 auto 10px;
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: 4px;
  background-color: #f5f5f5; /* 将背景色移至容器 */
  display: flex; /* 使用flex确保图片居中 */
  align-items: center;
  justify-content: center;
}

/* 统一图片样式 */
.person-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* 保持图片比例，完整显示 */
}

@media (max-width: 1200px) {
  .person-item {
    flex: 0 0 calc(33.333% - 20px);
  }
}

@media (max-width: 768px) {
  .person-item {
    flex: 0 0 calc(50% - 20px);
  }
}

@media (max-width: 576px) {
  .person-item {
    flex: 0 0 100%;
  }
  
  .person-image-container {
    max-width: 300px;
    height: 300px;
  }
}
</style>
