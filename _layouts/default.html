<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  {% include head.html %}
  <body>
    {% include header.html %}
    
    <div class="content-wrapper">
      {{ content }}
    </div>
    
    {% include footer.html %}
  </body>
</html>

<style>
  /* 基础样式 */
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #2c3540;
  }

  /* 内容区域 - 添加足够的顶部空间避免被导航栏遮挡 */
  .content-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: 120px 40px 60px; /* 增加顶部padding从40px到120px */
  }

  @media (max-width: 768px) {
    .content-wrapper {
      padding: 100px 20px 40px; /* 移动端也要留足空间 */
    }
  }
</style>
