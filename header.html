<!-- 
  现代化导航栏组件
  将此文件保存为 _includes/header.html (或者根据你的主题结构调整)
-->

<style>
  /* 导航栏样式 */
  .site-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    box-shadow: 0 2px 30px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
  }

  .site-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .site-title {
    color: white;
    font-weight: 700;
    font-size: 1.6em;
    text-decoration: none;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .site-title:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }

  .nav-links {
    display: flex;
    gap: 35px;
    align-items: center;
  }

  .nav-links a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    font-size: 1.05em;
    transition: all 0.3s;
    position: relative;
    padding: 5px 0;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: white;
    transition: width 0.3s;
  }

  .nav-links a:hover::after,
  .nav-links a.active::after {
    width: 100%;
  }

  .nav-links a:hover {
    opacity: 0.9;
  }

  /* 移动端菜单按钮 */
  .menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: white;
    font-size: 1.8em;
    cursor: pointer;
    padding: 5px;
    transition: transform 0.3s;
  }

  .menu-toggle:hover {
    transform: scale(1.1);
  }

  /* 移动端样式 */
  @media (max-width: 768px) {
    .site-nav {
      padding: 15px 20px;
    }

    .menu-toggle {
      display: block;
    }

    .nav-links {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      flex-direction: column;
      gap: 0;
      padding: 80px 30px 30px;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    }

    .nav-links.active {
      right: 0;
    }

    .nav-links a {
      width: 100%;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 1.15em;
    }

    .nav-links a::after {
      display: none;
    }

    .close-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      color: white;
      font-size: 2em;
      cursor: pointer;
      padding: 5px;
    }

    /* 遮罩层 */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 999;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }
  }

  /* 搜索框样式（可选） */
  .search-box {
    position: relative;
  }

  .search-box input {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 8px 35px 8px 15px;
    color: white;
    outline: none;
    transition: all 0.3s;
    width: 200px;
  }

  .search-box input::placeholder {
    color: rgba(255,255,255,0.7);
  }

  .search-box input:focus {
    background: rgba(255,255,255,0.3);
    border-color: white;
    width: 250px;
  }

  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    pointer-events: none;
  }
</style>

<!-- 导航栏HTML -->
<header class="site-header">
  <nav class="site-nav">
    <!-- Logo/标题 -->
    <a href="/" class="site-title">
      <span>🧪</span>
      <span>Zhang Laboratory</span>
    </a>

    <!-- 移动端菜单按钮 -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      ☰
    </button>

    <!-- 导航链接 -->
    <div class="nav-links" id="navLinks">
      <button class="close-menu" id="closeMenu" aria-label="Close menu">×</button>
      <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
      <a href="/research/" {% if page.url contains "research" %}class="active"{% endif %}>Research</a>
      <a href="/publications/" {% if page.url contains "publications" %}class="active"{% endif %}>Publications</a>
      <a href="/people/" {% if page.url contains "people" %}class="active"{% endif %}>People</a>
      <a href="/chemlib/" {% if page.url contains "chemlib" %}class="active"{% endif %}>ChemLib</a>
      <a href="/contact/" {% if page.url contains "contact" %}class="active"{% endif %}>Contact</a>
      
      <!-- 可选：搜索框 -->
      <!-- 
      <div class="search-box">
        <input type="text" placeholder="Search...">
        <span class="search-icon">🔍</span>
      </div>
      -->
    </div>
  </nav>
</header>

<!-- 移动端遮罩层 -->
<div class="menu-overlay" id="menuOverlay"></div>

<!-- JavaScript -->
<script>
  // 移动端菜单控制
  const menuToggle = document.getElementById('menuToggle');
  const closeMenu = document.getElementById('closeMenu');
  const navLinks = document.getElementById('navLinks');
  const menuOverlay = document.getElementById('menuOverlay');

  function openMenu() {
    navLinks.classList.add('active');
    menuOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeMenuFn() {
    navLinks.classList.remove('active');
    menuOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  if (menuToggle) {
    menuToggle.addEventListener('click', openMenu);
  }

  if (closeMenu) {
    closeMenu.addEventListener('click', closeMenuFn);
  }

  if (menuOverlay) {
    menuOverlay.addEventListener('click', closeMenuFn);
  }

  // ESC键关闭菜单
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeMenuFn();
    }
  });

  // 点击导航链接后关闭移动菜单
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        closeMenuFn();
      }
    });
  });

  // 窗口调整时关闭移动菜单
  window.addEventListener('resize', () => {
    if (window.innerWidth > 768) {
      closeMenuFn();
    }
  });
</script>
