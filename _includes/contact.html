<div class="row g-5 mb-5">
  <div>
    {% for contact in site.data.settings.contact %}
    <div class="row g-5 mb-5 align-items-center">
      <div class="col-md-8">
        <h4>{{ contact.name }}</h4>
        <p>{{ contact.title }}</p>
        <p>Research and Scholarly Interests: {{ contact.Research_and_Scholarly_Interests }}</p>
        <p>Email: {{ contact.email }}</p>
        <p>Office: {{ contact.office_location }}</p>
      </div>
      <div class="col-md-4 d-flex justify-content-center">
        <!-- 移除比例容器，保持图片原始比例 -->
        <img src="{{ site.github.url }}/{{ contact.image }}" 
             alt="{{ contact.name }}" 
             class="rounded shadow-sm img-fluid"
             style="max-width: 280px; height: auto;">
      </div>
    </div>
    {% endfor %}
  </div>
</div>
