<div class="row g-5 mb-5" style="padding-top: 80px;"> <!-- 增加顶部内边距，数值可根据实际情况调整 -->
  <div>
    {% for contact in site.data.settings.contact %}
    <div class="row g-5 mb-5 align-items-center">
      <!-- 移除图片列，将内容列调整为全宽响应式布局 -->
      <div class="col-12 col-md-10 mx-auto"> <!-- 使用mx-auto居中，md以上10列保持留白 -->
        <h4>{{ contact.name }}</h4>
        <p>{{ contact.title }}</p>
        <p>Research Interests: {{ contact.Research_and_Scholarly_Interests }}</p>
        <p>Email: {{ contact.email }}</p>
        <p>Office: {{ contact.office_location }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
