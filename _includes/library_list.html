{% assign category = include.category %}

<div class="lib-header">
  <div class="lib-count">
    <span class="lib-count-num" id="mol-showing">—</span>
    <span class="lib-count-label" id="mol-count-label">loading…</span>
  </div>
  <div class="lib-search-wrap">
    <svg class="lib-search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="8.5" cy="8.5" r="5.5"/>
      <line x1="13.5" y1="13.5" x2="18" y2="18"/>
    </svg>
    <input class="lib-search" id="mol-search" type="text" placeholder="Search by ID, MW or SMILES…" autocomplete="off">
  </div>
</div>

<div class="mol-grid" id="mol-grid"></div>

<div class="mol-pagination" id="mol-pagination"></div>

<div class="mol-empty" id="mol-empty" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" width="48" height="48">
    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
  </svg>
  <p>No compounds match your search.</p>
</div>

<style>
/* ── Header bar ───────────────────────────────────────── */
.lib-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  gap: 16px;
  flex-wrap: wrap;
}
.lib-count { display: flex; align-items: baseline; gap: 6px; }
.lib-count-num { font-size: 28px; font-weight: 700; color: #1e2a3a; }
.lib-count-label { font-size: 14px; color: #7f8994; }

.lib-search-wrap { position: relative; flex: 1; max-width: 320px; }
.lib-search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: #9aa5b4; pointer-events: none;
}
.lib-search {
  width: 100%; padding: 9px 14px 9px 36px;
  border: 1px solid #dce3eb; border-radius: 10px;
  font-size: 14px; color: #2c3540; background: #f8fafb; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.lib-search:focus {
  border-color: #8b9cb6;
  box-shadow: 0 0 0 3px rgba(139,156,182,0.15);
  background: #fff;
}

/* ── Grid ─────────────────────────────────────────────── */
.mol-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  min-height: 200px;
}

/* ── Card ─────────────────────────────────────────────── */
.mol-card {
  background: #fff;
  border: 1px solid #e8edf3;
  border-radius: 14px;
  padding: 16px 14px 12px;
  display: flex; flex-direction: column; gap: 10px;
  transition: all 0.2s ease;
  position: relative;
}
.mol-card:hover {
  border-color: #8b9cb6;
  box-shadow: 0 6px 20px rgba(44,53,64,0.09);
  transform: translateY(-2px);
}
.mol-img-wrap {
  height: 140px;
  display: flex; align-items: center; justify-content: center;
  background: #f7f9fb; border-radius: 8px; overflow: hidden;
}
.mol-img-wrap img {
  max-width: 100%; max-height: 130px;
  object-fit: contain; display: block;
}
.mol-img-fallback {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.3;
}
.mol-img-fallback svg { width: 64px; }

.mol-info {
  display: flex; align-items: center;
  justify-content: space-between; gap: 6px;
}
.mol-id { font-size: 13px; font-weight: 700; color: #1e2a3a; letter-spacing: 0.02em; word-break: break-all; }
.mol-mw {
  font-size: 11px; background: #eef2f7; color: #5a6471;
  padding: 2px 8px; border-radius: 20px; white-space: nowrap; font-weight: 500; flex-shrink: 0;
}

/* ── SMILES toggle ────────────────────────────────────── */
.mol-smiles-wrap { position: relative; }
.mol-smiles-toggle {
  background: none; border: none; cursor: pointer;
  color: #9aa5b4; padding: 2px;
  display: flex; align-items: center; transition: color 0.2s;
  font-size: 11px; gap: 4px;
}
.mol-smiles-toggle:hover { color: #5a6471; }
.mol-smiles-box {
  position: absolute;
  bottom: calc(100% + 6px); left: 0; right: 0;
  background: #1e2a3a; color: #c8d8ea;
  font-size: 10px; font-family: 'SFMono-Regular', Consolas, monospace;
  padding: 8px 10px; border-radius: 8px;
  word-break: break-all; line-height: 1.5; z-index: 100;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  display: none;
}
.mol-smiles-box::after {
  content: ''; position: absolute; top: 100%; left: 10px;
  border: 5px solid transparent; border-top-color: #1e2a3a;
}

/* ── Skeleton loader ──────────────────────────────────── */
.mol-skeleton {
  background: #fff; border: 1px solid #e8edf3; border-radius: 14px;
  padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 10px;
}
.skel { background: linear-gradient(90deg,#f0f3f7 25%,#e4e8ed 50%,#f0f3f7 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
.skel-img { height: 140px; border-radius: 8px; }
.skel-line { height: 14px; }
.skel-line-short { height: 12px; width: 60%; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── Pagination ───────────────────────────────────────── */
.mol-pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 36px; flex-wrap: wrap;
}
.mol-page-btn {
  min-width: 36px; height: 36px; padding: 0 12px;
  border: 1px solid #dce3eb; border-radius: 8px;
  background: #fff; color: #4a5568; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.mol-page-btn:hover { border-color: #8b9cb6; color: #2c3540; background: #f5f7fa; }
.mol-page-btn.active { background: #2c3540; color: #fff; border-color: #2c3540; }
.mol-page-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.mol-page-info { font-size: 13px; color: #7f8994; padding: 0 8px; }

/* ── Empty state ──────────────────────────────────────── */
.mol-empty { text-align: center; padding: 60px 20px; color: #9aa5b4; }
.mol-empty p { margin-top: 12px; font-size: 15px; }

/* ── Responsive ───────────────────────────────────────── */
@media (max-width: 600px) {
  .mol-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .mol-img-wrap { height: 110px; }
}
</style>

<script>
(function() {
  const CATEGORY  = '{{ category }}';
  const DATA_URL  = '/assets/data/compounds_' + CATEGORY + '.json';
  const PAGE_SIZE = 60;

  const grid     = document.getElementById('mol-grid');
  const pagination = document.getElementById('mol-pagination');
  const searchEl = document.getElementById('mol-search');
  const emptyEl  = document.getElementById('mol-empty');
  const showingEl= document.getElementById('mol-showing');
  const labelEl  = document.getElementById('mol-count-label');

  let allData    = [];
  let filtered   = [];
  let currentPage = 1;

  // ── Skeleton loader ──────────────────────────────────
  function showSkeletons(n) {
    grid.innerHTML = Array.from({length: n}, () => `
      <div class="mol-skeleton">
        <div class="skel skel-img"></div>
        <div class="skel skel-line"></div>
        <div class="skel skel-line-short"></div>
      </div>`).join('');
  }

  // ── Render one page ──────────────────────────────────
  function renderPage(page) {
    currentPage = page;
    const start = (page - 1) * PAGE_SIZE;
    const items = filtered.slice(start, start + PAGE_SIZE);

    if (items.length === 0 && filtered.length === 0) {
      grid.innerHTML = '';
      emptyEl.style.display = 'block';
      pagination.innerHTML  = '';
      showingEl.textContent = '0';
      labelEl.textContent   = 'compounds';
      return;
    }
    emptyEl.style.display = 'none';

    grid.innerHTML = items.map(mol => {
      const imgSrc = '/assets/images/compounds/' + mol.ID + '.svg';
      const mwBadge = mol.MW ? `<div class="mol-mw">MW ${mol.MW}</div>` : '';
      const smiles  = mol.SMILES ? `
        <div class="mol-smiles-wrap">
          <button class="mol-smiles-toggle" onclick="toggleSmilesBtn(this)" title="Show SMILES">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2 4h12v1.5H2V4zm0 3.5h8V9H2V7.5zm0 3.5h10v1.5H2V11z"/>
            </svg> SMILES
          </button>
          <div class="mol-smiles-box">${escHtml(mol.SMILES)}</div>
        </div>` : '';
      return `
        <div class="mol-card">
          <div class="mol-img-wrap">
            <img src="${imgSrc}" alt="${escHtml(mol.ID)}" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="mol-img-fallback" style="display:none">
              <svg viewBox="0 0 60 40" fill="none" stroke="#bbb" stroke-width="1.5">
                <rect x="4" y="4" width="52" height="32" rx="4" stroke-dasharray="4 2"/>
                <circle cx="30" cy="20" r="7"/><line x1="22" y1="20" x2="14" y2="20"/><line x1="38" y1="20" x2="46" y2="20"/>
              </svg>
            </div>
          </div>
          <div class="mol-info">
            <div class="mol-id">${escHtml(mol.ID)}</div>
            ${mwBadge}
          </div>
          ${smiles}
        </div>`;
    }).join('');

    renderPagination();
    const end = Math.min(start + PAGE_SIZE, filtered.length);
    showingEl.textContent = `${start + 1}–${end}`;
    labelEl.textContent   = `of ${filtered.length.toLocaleString()} compounds`;
  }

  function renderPagination() {
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (totalPages <= 1) { pagination.innerHTML = ''; return; }

    const p = currentPage;
    let html = `<button class="mol-page-btn" ${p===1?'disabled':''} onclick="molGo(${p-1})">‹ Prev</button>`;

    // page numbers: first, ..., p-1, p, p+1, ..., last
    const pages = new Set([1, totalPages, p-1, p, p+1].filter(x => x>=1 && x<=totalPages));
    let prev = 0;
    for (const pg of [...pages].sort((a,b)=>a-b)) {
      if (pg - prev > 1) html += `<span class="mol-page-info">…</span>`;
      html += `<button class="mol-page-btn ${pg===p?'active':''}" onclick="molGo(${pg})">${pg}</button>`;
      prev = pg;
    }
    html += `<button class="mol-page-btn" ${p===totalPages?'disabled':''} onclick="molGo(${p+1})">Next ›</button>`;
    html += `<span class="mol-page-info">${totalPages} pages</span>`;
    pagination.innerHTML = html;
  }

  // ── Search / filter ──────────────────────────────────
  let searchTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = searchEl.value.toLowerCase().trim();
      filtered = q
        ? allData.filter(m =>
            (m.ID     && m.ID.toLowerCase().includes(q)) ||
            (m.MW     && String(m.MW).includes(q))       ||
            (m.SMILES && m.SMILES.toLowerCase().includes(q)))
        : allData;
      renderPage(1);
      window.scrollTo({top: grid.offsetTop - 120, behavior: 'smooth'});
    }, 300);
  });

  // ── Fetch data ───────────────────────────────────────
  showSkeletons(12);
  fetch(DATA_URL)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => {
      allData  = data;
      filtered = data;
      showingEl.textContent = data.length > PAGE_SIZE ? `1–${PAGE_SIZE}` : data.length;
      labelEl.textContent   = `of ${data.length.toLocaleString()} compounds`;
      renderPage(1);
    })
    .catch(err => {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#9aa5b4">
          <p style="font-size:15px">Dataset not yet available.</p>
          <small style="font-size:13px;color:#b8c4d0">Add the Excel file and run prepare_chemlib.py</small>
        </div>`;
      showingEl.textContent = '0';
      labelEl.textContent = 'compounds';
    });

  // ── Expose page nav globally ─────────────────────────
  window.molGo = function(page) {
    renderPage(page);
    window.scrollTo({top: grid.offsetTop - 140, behavior: 'smooth'});
  };
})();

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleSmilesBtn(btn) {
  const box = btn.nextElementSibling;
  const shown = box.style.display === 'block';
  document.querySelectorAll('.mol-smiles-box').forEach(el => el.style.display = 'none');
  if (!shown) box.style.display = 'block';
}
document.addEventListener('click', e => {
  if (!e.target.closest('.mol-smiles-wrap'))
    document.querySelectorAll('.mol-smiles-box').forEach(el => el.style.display = 'none');
});
</script>
